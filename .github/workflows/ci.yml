name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            setup.py
            requirements*.txt

      - name: Upgrade Core Packaging Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine

      - name: Install Dependencies and Package
        run: |
          python -m pip install pytest pytest-cov pyyaml ruff flake8
          python -m pip install -e .

      - name: Code Quality & Linting (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          ruff check src tests || true
          flake8 src tests --max-line-length=120 --ignore=E203,W503 || true

      - name: Run Test Suite with Pytest
        env:
          PYTHONPATH: src
        run: |
          pytest tests -v --durations=10

      - name: Build Distribution Packages
        run: |
          python -m build

      - name: Verify Package Metadata & Integrity
        run: |
          twine check dist/*
