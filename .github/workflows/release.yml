name: Release & Package Publishing

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-release:
    name: Build Packages, Checksums & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine wheel

      - name: Build Source Distribution & Universal Wheel
        run: |
          python -m build

      - name: Validate Built Artifacts
        run: |
          twine check dist/*

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-main-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Vision Gesture Control ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          files: |
            dist/*
          body: |
            # Vision Gesture Control Release `${{ steps.vars.outputs.tag }}`

            ### 📦 Distribution Artifacts
            - Pre-built universal wheels & source distribution packages.
            - Model Context Protocol (MCP) server integration for Claude Desktop, Cursor, Cline, and Zed.
            - Google Material 3 Light Mode Web Studio.

            ### 🛡️ Integrity Verification
            Verify the integrity of downloaded distribution files using SHA-256:
            ```bash
            sha256sum -c dist/SHA256SUMS.txt
            ```

      - name: Publish to PyPI (If Configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.PYPI_API_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*.whl dist/*.tar.gz
